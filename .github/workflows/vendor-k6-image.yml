name: Vendor GMKtec K6 image

on:
  push:
    branches:
      - feat/add-gmktec-k6-20261120

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-k6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-gmktec-k6-20261120
      - name: Download official GMKtec K6 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/pcs
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0"             "https://de.gmktec.com/cdn/shop/files/0d5cb15ef8488c2c80401a38728d28c8_1dbde6ff-b616-4c77-8bfb-ef70bad2f0b3.webp?v=1758092817"             -o public/images/pcs/gmktec-nucbox-k6.webp
          test "$(wc -c < public/images/pcs/gmktec-nucbox-k6.webp)" -gt 1000
          file --mime-type -b public/images/pcs/gmktec-nucbox-k6.webp | grep -q "^image/"
      - name: Commit image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/pcs/gmktec-nucbox-k6.webp
          git diff --cached --quiet && exit 0
          git commit -m "Vendor GMKtec K6 official image [vendor-k6]"
          git push origin HEAD:feat/add-gmktec-k6-20261120

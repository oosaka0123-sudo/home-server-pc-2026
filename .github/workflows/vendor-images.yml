name: Vendor PC images

on:
  push:
    branches:
      - feat/local-pc-images-complete-20261119

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-images]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-pc-images-complete-20261119
      - name: Download official product images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/pcs public/images/guide
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://download.lenovo.com/images/ProdImageDesktops/thinkcentre_m75q.jpg" -o public/images/pcs/thinkcentre-m75q-gen2.jpg
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://www.bee-link.com/cdn/shop/files/2_cdcbfcc1-2a7d-4028-a00c-aa921e600839_large.png?v=1752343503" -o public/images/pcs/beelink-ser8.png
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://www.minisforum.com/cdn/shop/files/1_83375d99-459d-4fe8-b5ea-afb4c3e6f994.jpg?v=1731310430" -o public/images/pcs/minisforum-um780-xtx.jpg
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://i.dell.com/is/image/DellContent//content/dam/ss2/product-images/dell-client-products/notebooks/latitude-notebooks/14-5420/global-spi/ng/notebook-latitude-5420-nt-relsize-500-ng.psd?fmt=jpg&hei=191&wid=500" -o public/images/guide/dell-latitude-5420.jpg
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://p3-ofp.static.pub/fes/cms/2022/06/13/c70uc8tdc9jq9bo4x41dphqfqusowi992268.png?height=584&width=584" -o public/images/guide/thinkpad-t14-gen2.png
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://jp.ext.hp.com/content/dam/jp-ext-hp-com/jp/ja/ec/notebooks/business/elitebook_830_g8/images/view2_mobile.jpg" -o public/images/guide/hp-elitebook-830-g8.jpg
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://support.microsoft.com/ja-jp/surface/media/4202347e-f4f7-0d30-87f2-966649fb1bef.png" -o public/images/guide/surface-pro-7.png
          curl -fL --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://support.microsoft.com/ja-jp/surface/media/d1fe3e2e-9261-fdba-6c36-81fe9dec4603.png" -o public/images/guide/surface-book-3.png
          find public/images -type f -maxdepth 3 -print0 | xargs -0 -I{} sh -c 'test "$(wc -c < "{}")" -gt 10000 || { echo "Image too small: {}"; exit 1; }'
      - name: Commit vendored images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet && exit 0
          git commit -m "Vendor official PC images [vendor-images]"
          git push origin HEAD:feat/local-pc-images-complete-20261119

name: Temporary npm audit detail

on:
  push:
    branches:
      - release/complete-site-20261120

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[audit-detail]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit detail
        run: npm audit --json || true

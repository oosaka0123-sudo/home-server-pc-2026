name: Temporary dependency fix

on:
  push:
    branches:
      - release/complete-site-20261120

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[deps-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/complete-site-20261120
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=moderate
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git diff --cached --quiet && exit 0
          git commit -m "Update vulnerable dependencies [deps-fixed]"
          git push origin HEAD:release/complete-site-20261120
